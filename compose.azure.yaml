services:
  db-init:
    image: postgres:16-alpine
    command: ["sh", "-c", "psql \"$DATABASE_URL\" -v ON_ERROR_STOP=1 -f /db/schema.sql"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in Azure .env}
    volumes: ["./db:/db:ro"]
    networks: [teras-net]

  minio-init:
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "/media/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in Azure .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in Azure .env}
    volumes: ["./media:/media:ro"]
    networks: [teras-net]

  portfolio:
    build: .
    container_name: neon_portfolio
    depends_on:
      db-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?set in Azure .env}
      PORT: 8080
    networks: [teras-net]
    restart: unless-stopped

networks:
  teras-net:
    external: true
    name: teras-luhur_teras-net
